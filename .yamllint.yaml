# Configuration yamllint du cours (make lint)
extends: default
# Fichiers générés (.gitignore) et fichiers amont non modifiables (.yamllintignore)
ignore-from-file: [.gitignore, .yamllintignore]
rules:
  line-length:
    max: 120
  document-start: disable
  braces:                 # style compact { name: x, value: y } des manifests du cours
    max-spaces-inside: 1
  truthy:
    allowed-values: ["true", "false", "on"]   # « on: » des workflows GitHub
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent
