[project]
name = "mlops-cours-2026"
version = "2026.10.0"
description = "Cours MLOps — projet fil rouge (credit scoring par défaut) construit lab après lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Socle M0 → M8 : un seul environnement, installé par `uv sync`.
dependencies = [
  # Données, modélisation
  "pandas==2.3.3",            # Feast 0.66 exige pandas<3
  "numpy>=2.2,<3",
  "scikit-learn==1.9.1",
  "pyyaml>=6",
  "matplotlib>=3.10",
  # Versioning, tracking (M0-M1)
  "mlflow==3.16.1",
  "dvc[s3]==3.67.1",
  "boto3>=1.40,<2",          # 1.43.108 incompatible avec aiobotocore (dvc-s3)
  "feast==0.66.0",
  # Orchestration (M2)
  "kfp==2.17.0",
  "kfp-kubernetes==2.17.0",
  # Validation (M3)
  "great-expectations==1.23.2",
  "pandera>=0.30,<1",
  "evidently==0.7.23",
  # Packaging, serving (M4-M5)
  "onnx>=1.18,<2",
  "onnxruntime>=1.22,<2",
  "skl2onnx>=1.19,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28",
  "bentoml>=1.4,<1.5",
  "locust>=2.40,<3",
  # Monitoring (M7)
  "prometheus-client>=0.24,<0.25",   # Feast 0.66 : <0.25
  # Gouvernance (M8)
  "fairlearn>=0.13,<0.15",
  "shap>=0.48,<1",
  "numba>=0.61",              # dépendance de shap : éviter un vieux numba à compiler
  "scipy>=1.14",              # tests de drift (KS, Wasserstein) au Lab 3
  "modelscan>=0.8.8,<0.9",
]

[dependency-groups]
dev = ["ruff==0.16.10", "pytest==9.1.1", "yamllint>=1.37"]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["labs/*/starter", "rag", "tools/build_pdf"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ et packaging/app/ importables sans installer le projet (packaging/ n'est PAS un paquet)
pythonpath = [".", "packaging"]
